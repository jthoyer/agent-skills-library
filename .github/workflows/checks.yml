name: checks

# Three mechanical checks that each catch a defect class this library has
# shipped at least once. Until now all three ran only when someone remembered
# to launch CPO first — and four dead pointers shipped in one week past readers
# looking straight at the lines carrying them. A check that needs a person to
# remember it inherits exactly the failure mode it was built to remove.
#
# Each script exits non-zero on a real finding and prints what it found. None
# needs anything beyond bash, so there is no install step and no cache.

on:
  # `pull_request` covers every branch that has a PR open; `push` covers main.
  # Listing both without narrowing `push` runs each PR commit twice — which the
  # first version of this file did, visibly, on its own opening commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Does every path and filename the agents AND skills assert resolve
      # against disk? Catches: dead pointers, in both the ~/.claude and
      # repo-relative forms. Skills joined the scope on 2026-09-19 — they are
      # the half that reaches every session, and had no checks at all.
      - name: References resolve
        run: bash scripts/check-references.sh

      # Is plugin.json's agents list still the agents on disk?
      # Catches: an agent added or renamed without the manifest following.
      - name: Plugin manifest current
        run: bash scripts/sync-plugin-manifest.sh --check

      # Does every agent declare a dispatchable name, a model, tools, and a
      # description under the 1,024-character cap — and end without a stray tag?
      # Does every skill parse as YAML, match its directory name, stay under the
      # same cap and the 500-line body standard, and appear in the README index?
      # Catches: undispatchable agents, silently truncated routing descriptions,
      # skills whose frontmatter does not parse (found market-analyst on the
      # first run), and a skills index that has drifted from disk.
      - name: Frontmatter and trailing lines
        run: bash scripts/check-frontmatter.sh

      # Does every skill follow Anthropic's structural guidance (2026-10)?
      # Catches: a reference file over 100 lines with no contents list (Claude
      # previews the first 100), a reference reachable only through another
      # reference, and a skill whose scripts never state what they need.
      - name: Skill structure
        run: bash scripts/check-skill-structure.sh

      # Does research-to-ideas' brief checker still enforce the skill's rules?
      # Catches: a checker that passes a Contested idea at Medium, a decision
      # rule with a gap, or a malformed brief that crashes instead of failing.
      # The first version shipped all three. Stdlib python only, no install.
      - name: research-to-ideas checker tests
        run: python3 .claude/skills/research-to-ideas/scripts/test_check_brief.py

      # Does multi-actor-strategy's run checker still enforce the skill's rules?
      # Catches: a run with no sustain option, an unchallenged option, a bet
      # missing, an unanswered pick gap, an Assumed rationale at Stage 4, or an
      # embodied run calling itself blind. The baseline run must pass and one
      # decoy per rule must fail on that rule alone. Stdlib python only.
      - name: multi-actor-strategy checker tests
        run: python3 .claude/skills/multi-actor-strategy/scripts/test_check_strategy.py
